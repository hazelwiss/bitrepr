[package]
name = "bitrepr-macros"
version = "0.1.0"
edition = "2024"
description = "Macro crate for bitrepr"
repository = "https://github.com/hazelwiss/bitrepr"
categories = []
keywords = ["macro"]
license-file = "../LICENSE"
readme = "../README.md"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0.104", features = ["full"] }
proc-macro2 = "1.0.95"
quote = "1.0.40"
